version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            # When appRoot is set, Amplify's working directory is already
            # frontend/ — no cd needed. All paths below are relative to frontend/.
            - echo "Branch: $AWS_BRANCH"
            - |
              if [ "$AWS_BRANCH" = "Production" ]; then
                echo "Loading production environment baseline"
                cp .env.production .env.local
                echo "NEXT_PUBLIC_ENV=production" >> .env.local
              elif [ "$AWS_BRANCH" = "demo" ]; then
                echo "Loading demo environment baseline"
                cp .env.demo .env.local
                echo "NEXT_PUBLIC_ENV=demo" >> .env.local
              else
                echo "Unknown branch ($AWS_BRANCH) — using demo baseline as fallback"
                cp .env.demo .env.local
                echo "NEXT_PUBLIC_ENV=demo" >> .env.local
              fi
            - npm ci

        build:
          commands:
            - npm run build

        postBuild:
          commands:
            - |
              echo "==================================================="
              echo "Build complete"
              echo "Branch:      $AWS_BRANCH"
              echo "Environment: $NEXT_PUBLIC_ENV"
              echo "App:         $NEXT_PUBLIC_APP_NAME"
              echo "==================================================="

      artifacts:
        # baseDirectory is relative to appRoot (frontend/).
        # .next is correct — NOT frontend/.next (that would resolve to frontend/frontend/.next).
        baseDirectory: .next
        files:
          - '**/*'

      cache:
        # Also relative to appRoot (frontend/).
        paths:
          - node_modules/**/*

    appRoot: frontend
