version: 1
frontend:
  phases:
    preBuild:
      commands:
        - |
          if [ "$AWS_BRANCH" = "production" ]; then
            cp .env.production .env.local
            echo "NEXT_PUBLIC_ENV=production" >> .env.local
          else
            cp .env.demo .env.local
            echo "NEXT_PUBLIC_ENV=demo" >> .env.local
          fi
        - npm ci

    build:
      commands:
        - npm run build

    postBuild:
      commands:
        - echo "done"

  artifacts:
    baseDirectory: .next
    files:
      - '**/*'

  cache:
    paths:
      - node_modules/**/*
