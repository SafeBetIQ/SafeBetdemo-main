version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --prefix frontend

    build:
      commands:
        - npm run build --prefix frontend

    postBuild:
      commands:
        - echo "Build complete — Branch=$AWS_BRANCH"

  artifacts:
    baseDirectory: frontend/.next
    files:
      - '**/*'

  cache:
    paths:
      - frontend/node_modules/**/*
