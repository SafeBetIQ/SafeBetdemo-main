version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - echo "Branch: $AWS_BRANCH"
            - |
              if [ "$AWS_BRANCH" = "Production" ]; then
                cp .env.production .env.local
                echo "NEXT_PUBLIC_ENV=production" >> .env.local
              elif [ "$AWS_BRANCH" = "demo" ]; then
                cp .env.demo .env.local
                echo "NEXT_PUBLIC_ENV=demo" >> .env.local
              else
                cp .env.demo .env.local
                echo "NEXT_PUBLIC_ENV=demo" >> .env.local
              fi
            - npm ci

        build:
          commands:
            - npm run build

        postBuild:
          commands:
            # Assemble the standalone bundle. Next.js does NOT copy these automatically.
            # Without this, the server starts but serves 404 for all static assets.
            - cp -r .next/static .next/standalone/.next/static
            - cp -r public .next/standalone/public
            - |
              echo "==================================================="
              echo "Build complete"
              echo "Branch:      $AWS_BRANCH"
              echo "Environment: $NEXT_PUBLIC_ENV"
              echo "App:         $NEXT_PUBLIC_APP_NAME"
              echo "==================================================="

      artifacts:
        # standalone/ contains server.js + node_modules + assembled assets.
        # Path is relative to appRoot (frontend/), resolves to frontend/.next/standalone.
        baseDirectory: .next/standalone
        files:
          - '**/*'

      cache:
        paths:
          - node_modules/**/*

    appRoot: frontend
