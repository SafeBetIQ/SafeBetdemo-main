# SafeBet IQ — Supabase CLI Configuration
# Documentation: https://supabase.com/docs/guides/cli/config
#
# ┌─────────────────────────────────────────────────────────────────────────┐
# │  PURPOSE                                                                │
# │  This file configures the LOCAL development Supabase instance only.    │
# │  For remote deployments use:                                            │
# │    supabase db push --project-ref $SUPABASE_DEMO_PROJECT_REF           │
# │    supabase db push --project-ref $SUPABASE_PROD_PROJECT_REF           │
# │  See supabase/config.demo.toml and supabase/config.prod.toml for       │
# │  environment-specific settings and project refs.                        │
# └─────────────────────────────────────────────────────────────────────────┘

# Local-only identifier — does NOT affect which remote project is targeted.
# Remote project is selected via `supabase link` or `--project-ref`.
project_id = "safebetiq-local"

# ── API ───────────────────────────────────────────────────────────────────────
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

# ── Database ──────────────────────────────────────────────────────────────────
[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

# ── Realtime ──────────────────────────────────────────────────────────────────
[realtime]
enabled = true

# ── Studio ────────────────────────────────────────────────────────────────────
[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

# ── Storage ───────────────────────────────────────────────────────────────────
[storage]
enabled = true
file_size_limit = "50MiB"

# ── Analytics ─────────────────────────────────────────────────────────────────
[analytics]
enabled = false
port = 54324
backend = "postgres"

# ── Auth ──────────────────────────────────────────────────────────────────────
[auth]
enabled = true
# Local dev — change to your tunnel URL if you need OAuth callbacks
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Signup is disabled — all users are provisioned by migration
enable_signup = false
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
# Disable email confirmation for local dev (no SMTP configured)
enable_confirmations = false
secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[auth.sms]
enable_signup = false
enable_confirmations = false
max_frequency = "5s"

# External OAuth providers — all disabled, SafeBet IQ uses email/password only
[auth.external.apple]
enabled = false
[auth.external.azure]
enabled = false
[auth.external.bitbucket]
enabled = false
[auth.external.discord]
enabled = false
[auth.external.facebook]
enabled = false
[auth.external.github]
enabled = false
[auth.external.gitlab]
enabled = false
[auth.external.google]
enabled = false
[auth.external.linkedin_oidc]
enabled = false
[auth.external.notion]
enabled = false
[auth.external.slack_oidc]
enabled = false
[auth.external.spotify]
enabled = false
[auth.external.twitter]
enabled = false
[auth.external.zoom]
enabled = false

# ── Edge Functions ────────────────────────────────────────────────────────────
[edge_runtime]
enabled = true
# "oneshot" — each invocation gets a fresh isolate (safe for local testing)
policy = "oneshot"
inspector_port = 8083

# JWT verification per function.
# api-ingest and casino-simulator use their own HMAC/API-key auth,
# so verify_jwt = false is intentional.
[functions.api-ingest]
verify_jwt = false

[functions.bri-risk-score]
verify_jwt = true

[functions.casino-simulator]
verify_jwt = false

[functions.cross-operator-intelligence]
verify_jwt = true

[functions.db-maintenance]
verify_jwt = true

[functions.demo-sync-all-casinos]
verify_jwt = false

[functions.integration-altenar-sync]
verify_jwt = true

[functions.integration-betsoftware-sync]
verify_jwt = true

[functions.integration-evolution-sync]
verify_jwt = true

[functions.integration-playtech-sync]
verify_jwt = true

[functions.integration-softswiss-sync]
verify_jwt = true

[functions.integration-whatsapp-send]
verify_jwt = true

[functions.intervention-engine]
verify_jwt = true

[functions.reset-staff-password]
verify_jwt = true

[functions.safeplay-ai-risk-engine]
verify_jwt = true

[functions.self-exclusion-network]
verify_jwt = true

[functions.send-wellbeing-invitation]
verify_jwt = true

[functions.sync-real-casino-data]
verify_jwt = true

[functions.wellbeing-risk-calculator]
verify_jwt = true
