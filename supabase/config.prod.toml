# SafeBet IQ — PRODUCTION Environment Config
# ─────────────────────────────────────────────────────────────────────────────
# Project : SafeBet IQ — Production
# Branch  : Production (default branch in Supabase project)
# Purpose : Live production environment — NEVER push here without
#           first validating on Demo
#
# ⚠️  WARNING: Migrations pushed here affect LIVE DATA.
#     Always push to Demo first and verify.
#
# HOW TO GET YOUR PROJECT REF
# ───────────────────────────
# 1. Open https://supabase.com/dashboard
# 2. Select the "SafeBet IQ — Production" project
# 3. Go to Project Settings → General
# 4. Copy the "Reference ID"  (looks like: zyxwvutsrqponmlk)
# 5. Replace REPLACE_WITH_PROD_PROJECT_REF below with that value
#    OR export it as an environment variable:
#
#       export SUPABASE_PROD_PROJECT_REF=zyxwvutsrqponmlk
#
# HOW TO PUSH MIGRATIONS TO PRODUCTION
# ──────────────────────────────────────
#   supabase db push --project-ref $SUPABASE_PROD_PROJECT_REF
#
# Or using npm scripts (after setting the env var):
#   npm run db:push:prod
#
# ─────────────────────────────────────────────────────────────────────────────

# Replace with the actual production Supabase project reference ID.
# This value is NOT a secret — it is safe to commit once known.
project_id = "REPLACE_WITH_PROD_PROJECT_REF"

# ── API ───────────────────────────────────────────────────────────────────────
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

# ── Database ──────────────────────────────────────────────────────────────────
[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

# ── Realtime ──────────────────────────────────────────────────────────────────
[realtime]
enabled = true

# ── Studio ────────────────────────────────────────────────────────────────────
[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

# ── Storage ───────────────────────────────────────────────────────────────────
[storage]
enabled = true
file_size_limit = "50MiB"

# ── Analytics ─────────────────────────────────────────────────────────────────
[analytics]
enabled = false
port = 54324
backend = "postgres"

# ── Auth ──────────────────────────────────────────────────────────────────────
[auth]
enabled = true
site_url = "https://app.safebetiq.com"
additional_redirect_urls = [
  "https://app.safebetiq.com",
  "https://app.safebetiq.com/login",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Signup disabled — all production users are provisioned by admins
enable_signup = false
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
# Production: enable email confirmation for new signups
enable_confirmations = true
secure_password_change = true
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[auth.sms]
enable_signup = false
enable_confirmations = false
max_frequency = "5s"

[auth.external.apple]
enabled = false
[auth.external.azure]
enabled = false
[auth.external.bitbucket]
enabled = false
[auth.external.discord]
enabled = false
[auth.external.facebook]
enabled = false
[auth.external.github]
enabled = false
[auth.external.gitlab]
enabled = false
[auth.external.google]
enabled = false
[auth.external.linkedin_oidc]
enabled = false
[auth.external.notion]
enabled = false
[auth.external.slack_oidc]
enabled = false
[auth.external.spotify]
enabled = false
[auth.external.twitter]
enabled = false
[auth.external.zoom]
enabled = false

# ── Edge Functions ────────────────────────────────────────────────────────────
[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

[functions.api-ingest]
verify_jwt = false

