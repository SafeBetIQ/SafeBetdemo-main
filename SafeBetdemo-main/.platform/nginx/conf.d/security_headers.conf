# Security headers for SafeBet IQ Demo
# Applied to all responses from the Next.js origin server.
# CloudFront passes these through to the browser.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# Content-Security-Policy
# - Supabase project uexdjngogzunjxkpxwll for API + auth
# - Vercel Analytics (va.vercel-scripts.com) if used
# - self for scripts, styles, fonts, images
# - unsafe-inline for Next.js inline styles (required until nonce-based CSP is adopted)
# - unsafe-eval blocked (no eval usage in production)
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://va.vercel-scripts.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://uexdjngogzunjxkpxwll.supabase.co wss://uexdjngogzunjxkpxwll.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
