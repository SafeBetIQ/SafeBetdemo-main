# Static security headers for SafeBet IQ (applied to every response).
# CloudFront passes these through to the browser.
#
# NOTE (ORR-1A / WS1): the Content-Security-Policy is NO LONGER set here.
# It is environment-aware and emitted by the Next.js origin
# (next.config.js -> headers()), derived from NEXT_PUBLIC_SUPABASE_URL, so
# Development / Demo / Production each use their correct Supabase endpoints
# with no manual edit per deployment. Only env-INDEPENDENT headers live here.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
