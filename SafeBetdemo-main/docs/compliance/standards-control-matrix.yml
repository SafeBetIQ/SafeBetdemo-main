    exceptions: "A5 CLOSED (A5.1-A5.5). A5.1 (18 trigger/cron/worker) + A5.2 (12 dormant P0) + A5.3 (31 live-caller-proofed) revoked PUBLIC/anon; A5.4 (3 proven-pure fns) DEFINER->INVOKER; A5.5 final classification of all 138 retained definers (0 UNKNOWN), 138/138 owner postgres, 138/138 pinned search_path, future-regression CI guard (ci:privfn), final baseline + access matrix. Final: SECURITY DEFINER 138, anon 1, public 1, authenticated 84, service_role 137 (secdef-scoped). Sole anon/public = RLS predicate sbiq_may_access_chain_scope (governed allowlist exception, required by RLS execution semantics). NOT CONFORMANT-full because: (1) the RLS-predicate exception is by-design permanent, (2) MFA OPEN P1 hard gate before privileged regulatory-role activation, (3) broad authenticated (84) narrowing deferred to future RBAC/ABAC. No RLS weakening; no new exposure; Production untouched. See PRIVILEGED_FUNCTION_BASELINE.md + FUNCTION_ACCESS_MATRIX.md + ADR-0005."
