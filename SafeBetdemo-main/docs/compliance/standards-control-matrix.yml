# SafeBet — Standards Control Matrix (initial skeleton)
# Architecture Authority v4.0 §15. Machine- + human-readable.
# NOT a certification claim. No copyrighted clause text is reproduced; where a
# clause-level requirement is needed but unavailable, status = STANDARD_TEXT_REQUIRED.
# Editions must be re-verified against the current SABS/ISO source before conformity.

meta:
