# SafeBet IQ — pilot.safebetiq.com reproducible Linux Node 20 build (AWS CodeBuild) — M1B-P1F
# ─────────────────────────────────────────────────────────────────────────────
# PILOT-ONLY buildspec. The Demo buildspec (deploy/buildspec.yml) is intentionally untouched.
# Produces the Elastic Beanstalk artifact for the `safebet-iq-pilot` environment, built under
# Node.js 20 to match the EB Node 20 platform (same packaging as Demo).
#
# Pilot environment model (fail closed):
#   NEXT_PUBLIC_ENV=pilot, NEXT_PUBLIC_SAFEBET_ENV=pilot
#     → demo quick-login route 404 (requires 'demo'), demo super-admin routes 404,
#       DemoOperatorSelector hidden, casino-simulator burst producer disabled.
#   SAFEBET_OPERATING_MODE / NEXT_PUBLIC_SAFEBET_OPERATING_MODE = production
#     → the ONLY operational profile with simulatorEnabled=false and demoDataAllowed=false.
#       'pilot' is NOT a supported mode: lib/operations/mode.ts normalises unknown values to the
#       'demonstration' default (simulator ON), so it must never be used here.
#   ENABLE_DEMO_QUICK_LOGIN=false (and the route is dead anyway unless NEXT_PUBLIC_ENV=demo).
#   SAFEBET_IDENTITY_PROVIDER / NEXT_PUBLIC_SAFEBET_IDENTITY_PROVIDER: deliberately UNSET →
#     the current IQ default 'sha256-v2' (ADR-001), identical to Demo. No Cognito.
#
# Public build inputs (NEXT_PUBLIC_* only; NEVER the service-role key) are supplied at start-build:
#   NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY  (the NEW Pilot project's values)
#   SAFEBET_GIT_COMMIT (must equal the authorised commit), SAFEBET_EB_VERSION
# pre_build re-asserts every Pilot value, so a start-build override cannot turn this into Demo.

version: 0.2

env:
  variables:
    NEXT_PUBLIC_ENV: "pilot"
    NEXT_PUBLIC_SAFEBET_ENV: "pilot"
    NEXT_PUBLIC_SAFEBET_OPERATING_MODE: "production"
    SAFEBET_OPERATING_MODE: "production"
    ENABLE_DEMO_QUICK_LOGIN: "false"
    # TWO SEPARATE AUTHORITIES (M1B-P1F Correction 6 / M1B-P1 / M1B-P2A.1):
    #   SAFEBET_SCHEMA_SOURCE_COMMIT = provenance of the curated, IMMUTABLE schema baseline (530941a5…).
    #     Hard-coded here on purpose. It is NOT the application deployment authority; the Pilot
    #     application MUST NOT be deployed from it (it predates the M1B-P1F hardening).
    #   SAFEBET_APP_COMMIT = the authorised Pilot APPLICATION deployment commit. It is DELIBERATELY NOT
    #     hard-coded in this file. This buildspec lives inside the very source it would authorise, so
    #     embedding the SHA is self-referential: editing the file changes the deployable SHA, which then
    #     no longer matches the embedded value. Instead SAFEBET_APP_COMMIT is a GOVERNED, CodeBuild
    #     PROJECT-LEVEL environment variable:
    #       • set to the owner-approved reviewed application commit AFTER review (in the AWS phase);
    #       • normal build invocations MUST NOT override it (it is the approval authority);
    #       • SAFEBET_GIT_COMMIT is the commit actually packaged into the S3 source — equality with
    #         SAFEBET_APP_COMMIT proves the package matches the authorised reviewed commit;
    #       • changing the reviewed application commit requires an explicit governed update to the
    #         CodeBuild project configuration — never a code edit here, never a branch-HEAD fallback;
    #       • there is NO default/fallback value: the build fails closed if SAFEBET_APP_COMMIT is unset.
    #     Neither commit variable may ever hold a secret.
    SAFEBET_SCHEMA_SOURCE_COMMIT: "379141e45c7f6f9db1888ebaebfa45fbf86a993e"
    SAFEBET_FORBIDDEN_REFS: "ilibvipqbkugqkppzdmh druuskabkgyotslcgnys uexdjngogzunjxkpxwll"
    NODE_OPTIONS: "--max-old-space-size=4096"

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "== build env ==" && node --version && npm --version && uname -a
  pre_build:
    commands:
      - |
        set -eu
        fail() { echo "PILOT BUILD GUARD: $1" >&2; exit 1; }
        [ "${NEXT_PUBLIC_ENV:-}" = "pilot" ] || fail "NEXT_PUBLIC_ENV must be 'pilot'"
        [ "${NEXT_PUBLIC_SAFEBET_ENV:-}" = "pilot" ] || fail "NEXT_PUBLIC_SAFEBET_ENV must be 'pilot'"
        [ "${SAFEBET_OPERATING_MODE:-}" = "production" ] || fail "SAFEBET_OPERATING_MODE must be 'production' (simulator off)"
        [ "${NEXT_PUBLIC_SAFEBET_OPERATING_MODE:-}" = "production" ] || fail "NEXT_PUBLIC_SAFEBET_OPERATING_MODE must be 'production'"
        case "${ENABLE_DEMO_QUICK_LOGIN:-false}" in false|"") ;; *) fail "ENABLE_DEMO_QUICK_LOGIN must be unset/false";; esac
        [ -z "${SAFEBET_IDENTITY_PROVIDER:-}" ] && [ -z "${NEXT_PUBLIC_SAFEBET_IDENTITY_PROVIDER:-}" ] || fail "identity provider must stay unset (IQ default sha256-v2)"
        [ -n "${NEXT_PUBLIC_SUPABASE_URL:-}" ] || fail "NEXT_PUBLIC_SUPABASE_URL (Pilot project) required"
        [ -n "${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}" ] || fail "NEXT_PUBLIC_SUPABASE_ANON_KEY (Pilot project) required"
        for r in $SAFEBET_FORBIDDEN_REFS; do
          case "$NEXT_PUBLIC_SUPABASE_URL" in *"$r"*) fail "NEXT_PUBLIC_SUPABASE_URL targets a forbidden project (Production/Guardian/Demo)";; esac
        done
        # M1B-P2B.2 — EXACT positive allowlist: the Pilot build may ONLY target the authorised Pilot
        # project URL. This rejects unknown 4th projects, lookalike hostnames, appended paths/queries,
        # trailing slashes and malformed values (the denylist above is defence-in-depth only).
        [ "${NEXT_PUBLIC_SUPABASE_URL}" = "https://umejmtnzxbmezraercdj.supabase.co" ] || fail "NEXT_PUBLIC_SUPABASE_URL must be EXACTLY https://umejmtnzxbmezraercdj.supabase.co (authorised Pilot project)"
        # Application deployment authority (M1B-P2A.1 — externalised, no hard-coded SHA in this file).
        #   SAFEBET_APP_COMMIT is the GOVERNED approval authority, supplied by the CodeBuild PROJECT
        #   configuration (never defaulted here, never derived from branch HEAD). It must exist, be a
        #   40-lowercase-hex commit, and must not be the schema-baseline source commit.
        [ -n "${SAFEBET_APP_COMMIT:-}" ] || fail "SAFEBET_APP_COMMIT (governed CodeBuild project value) required — there is no default"
        echo "${SAFEBET_APP_COMMIT}" | grep -Eq '^[0-9a-f]{40}$' || fail "SAFEBET_APP_COMMIT must be 40 lowercase hex"
        [ "${SAFEBET_APP_COMMIT}" != "$SAFEBET_SCHEMA_SOURCE_COMMIT" ] || fail "SAFEBET_APP_COMMIT must not be the schema-baseline SOURCE commit (379141e)"
        # SAFEBET_GIT_COMMIT is the commit ACTUALLY packaged into the S3 source. It must exist, be a
        # 40-lowercase-hex commit, must never be the schema-source commit, and must EQUAL the governed
        # SAFEBET_APP_COMMIT — proving the package matches the authorised reviewed application commit.
        [ -n "${SAFEBET_GIT_COMMIT:-}" ] || fail "SAFEBET_GIT_COMMIT (packaged source commit) required"
        echo "${SAFEBET_GIT_COMMIT}" | grep -Eq '^[0-9a-f]{40}$' || fail "SAFEBET_GIT_COMMIT must be 40 lowercase hex"
        [ "${SAFEBET_GIT_COMMIT}" != "$SAFEBET_SCHEMA_SOURCE_COMMIT" ] || fail "SAFEBET_GIT_COMMIT is the schema-baseline SOURCE commit (379141e) — not the application deployment authority"
        [ "${SAFEBET_GIT_COMMIT}" = "$SAFEBET_APP_COMMIT" ] || fail "SAFEBET_GIT_COMMIT must equal the authorised Pilot application commit (SAFEBET_APP_COMMIT)"
        # CODEBUILD_RESOLVED_SOURCE_VERSION is Git identity ONLY when it is a 40-hex Git SHA (GitHub/
        # CodeCommit sources). For the approved S3-backed source it is an S3 object version id and MUST
        # NOT be treated as Git identity — but it is never accepted as proof of the commit either.
        if echo "${CODEBUILD_RESOLVED_SOURCE_VERSION:-}" | grep -Eq '^[0-9a-f]{40}$'; then
          [ "$CODEBUILD_RESOLVED_SOURCE_VERSION" = "${SAFEBET_GIT_COMMIT}" ] || fail "resolved Git source version != authorised application commit"
          [ "$CODEBUILD_RESOLVED_SOURCE_VERSION" != "$SAFEBET_SCHEMA_SOURCE_COMMIT" ] || fail "resolved Git source version is the schema-source commit"
        else
          echo "note: CODEBUILD_RESOLVED_SOURCE_VERSION is not a 40-hex Git SHA (S3-backed source) — not used as Git identity; SAFEBET_GIT_COMMIT remains authoritative"
        fi
        [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ] || fail "the service-role key must never be a build input"
        echo "pilot build guard OK"
      - rm -rf .next node_modules
      - npm ci
  build:
    commands:
      - echo "== typecheck + next build under Node $(node --version) (pilot) =="
      - npm run build            # tsc --noEmit && next build
      - test -f .next/BUILD_ID && test -d .next/server && test -d .next/static
      - echo "BUILD_ID=$(cat .next/BUILD_ID)"
  post_build:
    commands:
      - echo "== regression suite (advisory, captured) =="
      - node --test "tests/**/*.test.mjs" 2>&1 | tail -60 || echo "TESTS_EXIT_NONZERO"
      - echo "== stage clean EB bundle =="
      - mkdir -p deploy_stage
      - cp -r .next public package.json package-lock.json next.config.js Procfile .ebextensions .platform deploy_stage/
      - rm -rf deploy_stage/.next/cache
      - rm -f deploy_stage/.ebextensions/02_build.config   # prebuilt: no on-instance build
      # Generate runtime version.json read by /api/version (safe provenance only)
      - |
        cat > deploy_stage/version.json <<JSON
        {
          "service": "safebet-iq",
          "environment": "${NEXT_PUBLIC_ENV}",
          "environmentClass": "non-production",
          "dataClass": "pilot-no-operator-data",
          "gitCommit": "${SAFEBET_GIT_COMMIT:-unknown}",
          "buildId": "$(cat .next/BUILD_ID)",
          "deploymentVersion": "${SAFEBET_EB_VERSION:-unknown}",
          "builtWithNode": "$(node --version | sed 's/^v//')",
          "deployedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        }
        JSON
      - cat deploy_stage/version.json
      - |
        grep -q '"environment": "pilot"' deploy_stage/version.json || { echo "version.json is not pilot" >&2; exit 1; }
      - test -f deploy_stage/.next/BUILD_ID
      - test ! -e deploy_stage/.ebextensions/02_build.config && echo "on-instance build config excluded OK"

artifacts:
  base-directory: deploy_stage
  files:
    - '**/*'
