name: Deploy to Elastic Beanstalk

on:
  push:
    branches: [Production, main]

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build (prod)
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Validate standalone build
        run: |
          if [ ! -f "frontend/.next/standalone/server.js" ]; then
            echo "ERROR: frontend/.next/standalone/server.js not found — check next.config.js output: standalone"
            exit 1
          fi
          echo "Standalone build OK."

      - name: Deploy to Elastic Beanstalk (safebet-iq-prod)
        shell: bash
        run: |
          set -e
          pwsh ./deploy.ps1 -TargetEnv prod -SkipBuild
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Health check (prod)
        run: |
          echo "Waiting 60s for EB to become healthy..."
          sleep 60
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -m 10 "${{ secrets.APP_URL }}/api/health")
          echo "Health check status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Health check failed — got HTTP $STATUS"
            exit 1
          fi
          echo "Health check passed."

      - name: Create Sentry release
        uses: getsentry/action-release@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        with:
          version: ${{ github.sha }}
          set_commits: auto

      - name: Clean build output for demo rebuild
        run: rm -rf frontend/.next

      - name: Build (demo)
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.DEMO_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.DEMO_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}

      - name: Deploy to Elastic Beanstalk (safebet-iq-demo)
        shell: bash
        run: |
          set -e
          pwsh ./deploy.ps1 -TargetEnv demo -SkipBuild
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DEMO_SUPABASE_SERVICE_ROLE_KEY }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Health check (demo)
        run: |
          echo "Waiting 60s for demo EB to become healthy..."
          sleep 60
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -m 10 "${{ secrets.DEMO_APP_URL }}/api/health")
          echo "Demo health check status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Demo health check failed — got HTTP $STATUS"
            exit 1
          fi
          echo "Demo health check passed."
