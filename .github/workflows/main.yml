name: Daily Backup to S3

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Install PostgreSQL client
        run: sudo apt-get install -y postgresql-client

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Set date
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      # DEMO BACKUP
      - name: Backup Demo DB
        run: |
          pg_dump "$SUPABASE_DB_URL_DEMO" > demo-backup.sql
          gzip demo-backup.sql

      - name: Upload Demo to S3
        run: |
          aws s3 cp demo-backup.sql.gz s3://safebetiq-backups/backups/demo/2026/04/demo-backup-${DATE}.sql.gz

      # PRODUCTION BACKUP
      - name: Backup Production DB
        run: |
          pg_dump "$SUPABASE_DB_URL_PROD" > prod-backup.sql
          gzip prod-backup.sql

      - name: Upload Production to S3
        run: |
          aws s3 cp prod-backup.sql.gz s3://safebetiq-backups/backups/production/2026/04/production-backup-${DATE}.sql.gz
