name: Daily Backup to S3

on:
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Force IPv4 priority
        run: |
          sudo sed -i 's/#precedence ::ffff:0:0\/96  100/precedence ::ffff:0:0\/96  100/' /etc/gai.conf

      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release
          echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          wget -qO - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /etc/apt/trusted.gpg.d/postgresql.asc
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Verify pg_dump version
        run: |
          /usr/lib/postgresql/17/bin/pg_dump --version
          which pg_dump

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Set date
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      # DEMO BACKUP
      - name: Backup Demo DB
        env:
          SUPABASE_DB_URL_DEMO: ${{ secrets.SUPABASE_DB_URL_DEMO }}
        run: |
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL_DEMO" > demo-backup.sql
          gzip demo-backup.sql

      - name: Upload Demo to S3
        run: |
          aws s3 cp demo-backup.sql.gz s3://safebetiq-backups/backups/demo/2026/04/demo-backup-${DATE}.sql.gz

      # PRODUCTION BACKUP
      - name: Backup Production DB
        env:
          SUPABASE_DB_URL_PROD: ${{ secrets.SUPABASE_DB_URL_PROD }}
        run: |
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL_PROD" > prod-backup.sql
          gzip prod-backup.sql

      - name: Upload Production to S3
        run: |
          aws s3 cp prod-backup.sql.gz s3://safebetiq-backups/backups/production/2026/04/production-backup-${DATE}.sql.gz
