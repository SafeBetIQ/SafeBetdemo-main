name: SafeBet IQ — CI Security Gate

# Supply-chain + build/test gate (AUD-P1-001 / AUD-P1-008). Runs on pull requests
# and on pushes to the protected/release branches. Blocks promotion when a
# production Critical/High dependency vulnerability (without a valid time-limited
# exception) exists, package-lock integrity fails, a secret is committed, the build
# fails, or the regression suite fails.

on:
  pull_request:
  push:
    branches: [master, Demo, release]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: SafeBetdemo-main   # the Next.js app lives in this subdirectory

jobs:
  security-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Deterministic install — fails if package-lock.json is out of sync (integrity).
      - name: Install (npm ci — lock-file integrity)
        run: npm ci

      # Dependency security gate — production Critical/High without a valid,
      # non-expired exception fails the build (verdict from audit JSON, not exit code).
      - name: Dependency security gate
        run: node scripts/ci/security-gate.mjs

      # Informational production audit (does not gate on its own exit code).
      - name: Production audit (report)
        run: npm audit --omit=dev || true

      - name: Secret scan
        run: node scripts/ci/secret-scan.mjs

      - name: Typecheck
        run: npm run typecheck

      # Next.js compiles the browser bundle here, so it needs the PUBLIC frontend
      # Supabase config (createClient reads these at module load — no network call
      # occurs at build). These are non-production, browser-public values held as
      # repository VARIABLES (never secrets); the service-role key is never used in
      # the frontend build. Fail clearly if the public build config is absent.
      - name: Build
        run: |
          if [ -z "${NEXT_PUBLIC_SUPABASE_URL}" ] || [ -z "${NEXT_PUBLIC_SUPABASE_ANON_KEY}" ]; then
            echo "::error::Missing required public Supabase build configuration (set repository variables NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_ANON_KEY)."
            exit 1
          fi
          npm run build:eb
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Regression tests
        run: npm test
