name: Auto Failover Detection

on:
  schedule:
    - cron: "*/5 * * * *"   # Runs every 5 minutes
  workflow_dispatch:

jobs:
  detect:
    runs-on: ubuntu-latest

    steps:
      # ======================
      # INSTALL POSTGRES CLIENT (FOR HEALTH CHECK)
      # ======================
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      # ======================
      # CONFIGURE AWS (REQUIRED FOR S3 ACCESS)
      # ======================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: af-south-1

      # ======================
      # CHECK DATABASE HEALTH
      # ======================
      - name: Check database connection
        id: dbcheck
        env:
          SUPABASE_DB_URL_PROD: ${{ secrets.SUPABASE_DB_URL_PROD }}
        run: |
          echo "🔍 Checking database connection..."

          if timeout 10 psql "$SUPABASE_DB_URL_PROD" -c "SELECT 1;" > /dev/null 2>&1; then
            echo "DB_OK=true" >> $GITHUB_ENV
            echo "✅ Database is UP"
          else
            echo "DB_OK=false" >> $GITHUB_ENV
            echo "❌ Database is DOWN"
          fi

      # ======================
      # GET LATEST BACKUP FROM S3
      # ======================
      - name: Get latest production backup
        if: env.DB_OK == 'false'
        id: latest
        run: |
          echo "📦 Finding latest backup..."

          FILE=$(aws s3 ls s3://safebetiq-backups-secondary/backups/production/ \
            --recursive | sort | tail -n 1 | awk '{print $4}')

          if [ -z "$FILE" ]; then
            echo "❌ No backup found!"
            exit 1
          fi

          echo "LATEST_FILE=$FILE" >> $GITHUB_ENV
          echo "Latest backup: $FILE"

      # ======================
      # TRIGGER FAILOVER WORKFLOW
      # ======================
      - name: Trigger failover restore
        if: env.DB_OK == 'false'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            console.log("🚨 AUTO FAILOVER TRIGGERED");

            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "failover-restore.yml",
              ref: "main",
              inputs: {
                confirm: "CONFIRM_FAILOVER",
                backup_file: process.env.LATEST_FILE
              }
            });

      # ======================
      # LOG SUCCESS
      # ======================
      - name: Status
        run: |
          echo "Auto failover check complete"
