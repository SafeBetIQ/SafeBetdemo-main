name: Auto Failover Detection

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  detect:
    runs-on: ubuntu-latest

    env:
      AWS_DEFAULT_REGION: eu-north-1

    steps:
      # ======================
      # INSTALL DEPENDENCIES
      # ======================
      - name: Install PostgreSQL client + AWS CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client awscli

      # ======================
      # CONFIGURE AWS
      # ======================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      # ======================
      # VERIFY AWS (CRITICAL)
      # ======================
      - name: Verify AWS credentials
        run: |
          echo "Testing AWS identity..."
          aws sts get-caller-identity

      # ======================
      # CHECK DATABASE HEALTH
      # ======================
      - name: Check database connection
        env:
          SUPABASE_DB_URL_PROD: ${{ secrets.SUPABASE_DB_URL_PROD }}
        run: |
          echo "Checking database connection..."

          if timeout 10 psql "$SUPABASE_DB_URL_PROD" -c "SELECT 1;" > /dev/null 2>&1; then
            echo "DB_OK=true" >> $GITHUB_ENV
            echo "Database is UP"
          else
            echo "DB_OK=false" >> $GITHUB_ENV
            echo "Database is DOWN"
          fi

      # ======================
      # GET LATEST BACKUP
      # ======================
      - name: Get latest production backup
        if: env.DB_OK == 'false'
        run: |
          echo "Finding latest backup..."

          FILE=$(aws s3 ls s3://safebetiq-backups-secondary/backups/production/ \
            --recursive | sort | tail -n 1 | awk '{print $4}')

          if [ -z "$FILE" ]; then
            echo "No backup found!"
            exit 1
          fi

          echo "LATEST_FILE=$FILE" >> $GITHUB_ENV
          echo "Latest backup: $FILE"

      # ======================
      # TRIGGER FAILOVER
      # ======================
      - name: Trigger failover restore
        if: env.DB_OK == 'false'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            console.log("AUTO FAILOVER TRIGGERED");

            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "failover-restore.yml",
              ref: "main",
              inputs: {
                confirm: "CONFIRM_FAILOVER",
                backup_file: process.env.LATEST_FILE
              }
            });

      # ======================
      # EMAIL ALERT
      # ======================
      - name: Send alert email
        if: env.DB_OK == 'false'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: mail.safebetiq.com
          server_port: 587
          secure: false
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "SafeBet IQ AUTO FAILOVER TRIGGERED"
          to: alerts@safebetiq.com
          from: alerts@safebetiq.com
          body: |
            AUTO FAILOVER ACTIVATED

            Database is DOWN and failover has been triggered.

            Repository: ${{ github.repository }}
            Workflow: ${{ github.workflow }}
            Run ID: ${{ github.run_id }}

            Check logs:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      # ======================
      # WHATSAPP ALERT
      # ======================
      - name: Send WhatsApp alert
        if: env.DB_OK == 'false'
        run: |
          curl -X POST https://api.twilio.com/2010-04-01/Accounts/${{ secrets.TWILIO_ACCOUNT_SID }}/Messages.json \
          --data-urlencode "To=${{ secrets.TWILIO_WHATSAPP_TO }}" \
          --data-urlencode "From=${{ secrets.TWILIO_WHATSAPP_FROM }}" \
          --data-urlencode "Body=SafeBet IQ AUTO FAILOVER TRIGGERED. Database DOWN. Recovery started." \
          -u "${{ secrets.TWILIO_ACCOUNT_SID }}:${{ secrets.TWILIO_AUTH_TOKEN }}"

      # ======================
      # SEND LOGS TO CLOUDWATCH
      # ======================
      - name: Send logs to CloudWatch
        if: always()
        run: |
          TIMESTAMP=$(date +%s000)
          LOG_STREAM="failover-$(date +%s)"

          aws logs create-log-stream \
            --region eu-north-1 \
            --log-group-name safebet-backups \
            --log-stream-name $LOG_STREAM || true

          if [ "${DB_OK}" = "true" ]; then
            MESSAGE="Database healthy - no failover required"
          else
            MESSAGE="FAILOVER TRIGGERED - Database down"
          fi

          aws logs put-log-events \
            --region eu-north-1 \
            --log-group-name safebet-backups \
            --log-stream-name $LOG_STREAM \
            --log-events "timestamp=$TIMESTAMP,message=$MESSAGE"

      # ======================
      # STATUS
      # ======================
      - name: Status
        run: |
          echo "Auto failover check complete"
