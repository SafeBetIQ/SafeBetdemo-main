name: Failover Restore (SAFE)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type CONFIRM_FAILOVER to proceed"
        required: true
      backup_file:
        description: "Backup path (e.g. backups/production/2026/04/file.sql.gz)"
        required: true

jobs:
  failover:
    runs-on: ubuntu-latest

    env:
      # Canonical S3 bucket — set this GitHub secret to the CDK output:
      # SafeBetDRTrigger.BackupBucketName  (e.g. safebetiq-backups-046276255259-eu-north-1)
      S3_BUCKET: ${{ secrets.S3_BUCKET_NAME }}

    steps:
      # ======================
      # SAFETY CHECK
      # ======================
      - name: Confirm failover
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "CONFIRM_FAILOVER" ]; then
            echo "❌ You must type CONFIRM_FAILOVER"
            exit 1
          fi

      # ======================
      # INSTALL PG CLIENT
      # ======================
      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release
          echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          wget -qO - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /etc/apt/trusted.gpg.d/postgresql.asc
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      # ======================
      # VERIFY VERSION (DEBUG)
      # ======================
      - name: Verify PostgreSQL version
        run: |
          /usr/lib/postgresql/17/bin/pg_dump --version
          /usr/lib/postgresql/17/bin/psql --version

      # ======================
      # AWS CONFIG
      # ======================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: af-south-1

      # ======================
      # SET DATE
      # ======================
      - name: Set date
        run: |
          echo "DATE=$(date +'%Y-%m-%d-%H-%M')" >> $GITHUB_ENV

      # ======================
      # BACKUP CURRENT DB (FIXED 🔥)
      # ======================
      - name: Backup current production BEFORE restore
        env:
          SUPABASE_DB_URL_PROD: ${{ secrets.SUPABASE_DB_URL_PROD }}
        run: |
          echo "📦 Creating pre-failover backup..."
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL_PROD" > pre-failover-$DATE.sql
          gzip pre-failover-$DATE.sql

      - name: Upload pre-failover backup to S3
        run: |
          aws s3 cp pre-failover-$DATE.sql.gz \
          s3://$S3_BUCKET/backups/pre-failover/pre-failover-$DATE.sql.gz \
          --sse AES256

      # ======================
      # DOWNLOAD BACKUP
      # ======================
      - name: Download backup from secondary
        run: |
          aws s3 cp \
          s3://$S3_BUCKET/${{ github.event.inputs.backup_file }} \
          restore.sql.gz

      # ======================
      # UNZIP
      # ======================
      - name: Unzip backup
        run: |
          gunzip restore.sql.gz

      # ======================
      # VALIDATE
      # ======================
      - name: Validate backup
        run: |
          if [ ! -s restore.sql ]; then
            echo "❌ Backup file is empty!"
            exit 1
          fi
          head -n 20 restore.sql

      # ======================
      # RESTORE (FIXED 🔥)
      # ======================
      - name: Restore database (SAFE FAILOVER)
        env:
          SUPABASE_DB_URL_PROD: ${{ secrets.SUPABASE_DB_URL_PROD }}
        run: |
          echo "⚠️ FAILOVER RESTORE STARTING..."
          /usr/lib/postgresql/17/bin/psql "$SUPABASE_DB_URL_PROD" < restore.sql

      # ======================
      # POST-RESTORE VALIDATION
      # ======================
      - name: Validate restore success
        env:
          SUPABASE_DB_URL_PROD: ${{ secrets.SUPABASE_DB_URL_PROD }}
        run: |
          echo "🔍 Verifying database is responding post-restore..."
          if timeout 15 /usr/lib/postgresql/17/bin/psql "$SUPABASE_DB_URL_PROD" -c "SELECT 1;" > /dev/null 2>&1; then
            echo "✅ Database is responding after failover restore"
          else
            echo "❌ Database NOT responding after restore - investigate immediately!"
            exit 1
          fi

      # ======================
      # CLOUDWATCH: FAILOVER AUDIT LOG
      # ======================
      - name: Audit log failover to CloudWatch
        if: always()
        run: |
          LOG_STREAM="failover-events-$(date +%Y-%m-%d)"
          TIMESTAMP=$(date +%s000)

          aws logs create-log-stream \
            --region eu-north-1 \
            --log-group-name safebet-backups \
            --log-stream-name "$LOG_STREAM" 2>/dev/null || true

          MESSAGE=$(printf '{"event":"failover-restore","status":"%s","operator":"%s","backup_file":"%s","run_id":"%s","timestamp":"%s"}' \
            "${{ job.status }}" "${{ github.actor }}" "${{ github.event.inputs.backup_file }}" \
            "${{ github.run_id }}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)")

          LOG_EVENTS=$(jq -n --argjson ts "$TIMESTAMP" --arg msg "$MESSAGE" '[{"timestamp":$ts,"message":$msg}]')
          aws logs put-log-events \
            --region eu-north-1 \
            --log-group-name safebet-backups \
            --log-stream-name "$LOG_STREAM" \
            --log-events "$LOG_EVENTS"

      # ======================
      # SUCCESS
      # ======================
      - name: Success
        run: |
          echo "✅ Failover complete and database validated"
          echo "🛡️ Pre-backup saved in S3"
          echo "📋 Audit log written to CloudWatch: safebet-backups/failover-events-$(date +%Y-%m-%d)"
