name: Daily Backup to S3

# ─────────────────────────────────────────────────────────────────────
# BUCKET: safebetiq-backups-{ACCOUNT_ID}-eu-north-1
#   Provisioned by CDK (SafeBetDRTrigger stack).
#   Set the S3_BUCKET_NAME secret in GitHub to the CDK output value.
#   This is the single canonical bucket used by all backup + restore
#   workflows — fixing the previous mismatch between backup.yml and
#   failover-restore.yml.
# ─────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'  # Runs daily at 2AM South Africa time (midnight UTC)

jobs:
  backup:
    runs-on: ubuntu-latest

    env:
      # Single source of truth for the S3 bucket — set this GitHub secret
      # to the CDK output: SafeBetDRTrigger.BackupBucketName
      S3_BUCKET: ${{ secrets.S3_BUCKET_NAME }}

    steps:
      - name: Force IPv4
        run: |
          echo "precedence ::ffff:0:0/96  100" | sudo tee -a /etc/gai.conf

      # Install PostgreSQL 17 client
      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release
          echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          wget -qO - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /etc/apt/trusted.gpg.d/postgresql.asc
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      # Verify pg_dump version
      - name: Verify pg_dump version
        run: |
          /usr/lib/postgresql/17/bin/pg_dump --version
          which pg_dump

      # Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      # Set date variables
      - name: Set date variables
        run: |
          echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
          echo "YEAR=$(date +'%Y')" >> $GITHUB_ENV
          echo "MONTH=$(date +'%m')" >> $GITHUB_ENV
          echo "DAY=$(date +'%d')" >> $GITHUB_ENV

      # ======================
      # DEMO BACKUP
      # ======================
      - name: Backup Demo DB
        env:
          SUPABASE_DB_URL_DEMO: ${{ secrets.SUPABASE_DB_URL_DEMO }}
        run: |
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL_DEMO" > demo-backup.sql
          gzip demo-backup.sql

      - name: Upload Demo to S3
        run: |
          aws s3 cp demo-backup.sql.gz \
          s3://$S3_BUCKET/backups/demo/$YEAR/$MONTH/demo-backup-$DATE.sql.gz \
          --region eu-north-1 --sse AES256

      # ======================
      # VALIDATE DEMO BACKUP
      # ======================
      - name: Validate Demo backup
        run: |
          if [ ! -s demo-backup.sql.gz ]; then
            echo "❌ Demo backup is empty!"
            exit 1
          fi
          DEMO_SIZE=$(stat -c%s demo-backup.sql.gz)
          echo "Demo backup size: ${DEMO_SIZE} bytes"
          if [ "$DEMO_SIZE" -lt 512 ]; then
            echo "❌ Demo backup suspiciously small (<512 bytes)!"
            exit 1
          fi
          echo "✅ Demo backup validated"

      # ======================
      # PRODUCTION BACKUP
      # ======================
      - name: Backup Production DB
        env:
          SUPABASE_DB_URL_PROD: ${{ secrets.SUPABASE_DB_URL_PROD }}
        run: |
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL_PROD" > prod-backup.sql
          gzip prod-backup.sql

      - name: Upload Production to S3
        run: |
          aws s3 cp prod-backup.sql.gz \
          s3://$S3_BUCKET/backups/production/$YEAR/$MONTH/production-backup-$DATE.sql.gz \
          --region eu-north-1 --sse AES256

      # ======================
      # MONTHLY BACKUP (DAY 1 ONLY)
      # ======================
      - name: Upload Monthly Backup
        if: env.DAY == '01'
        run: |
          aws s3 cp prod-backup.sql.gz \
          s3://$S3_BUCKET/backups/monthly/$YEAR/$MONTH/monthly-backup-$DATE.sql.gz \
          --region eu-north-1 --sse AES256

      # ======================
      # RESTORE TEST
      # ======================
      - name: Download latest backup
        run: |
          aws s3 cp \
          s3://$S3_BUCKET/backups/production/$YEAR/$MONTH/production-backup-$DATE.sql.gz \
          restore-test.sql.gz

      - name: Unzip backup
        run: |
          gunzip restore-test.sql.gz

      - name: Validate backup
        run: |
          if [ ! -s restore-test.sql ]; then
            echo "❌ Backup file is empty!"
            exit 1
          fi
          head -n 20 restore-test.sql

      # ======================
      # CLEANUP
      # ======================
      - name: Cleanup files
        run: |
          rm -f demo-backup.sql.gz prod-backup.sql.gz restore-test.sql

      # ======================
      # CLOUDWATCH METRIC: BackupSuccess
      # ======================
      - name: Metric - BackupSuccess (success)
        if: success()
        run: |
          aws cloudwatch put-metric-data \
            --namespace "SafeBetIQ/Backups" \
            --metric-name "BackupSuccess" \
            --value 1 \
            --unit Count \
            --region eu-north-1
          echo "✅ BackupSuccess metric sent: 1"

      - name: Metric - BackupSuccess (failure)
        if: failure()
        run: |
          aws cloudwatch put-metric-data \
            --namespace "SafeBetIQ/Backups" \
            --metric-name "BackupSuccess" \
            --value 0 \
            --unit Count \
            --region eu-north-1
          echo "❌ BackupSuccess metric sent: 0"

      # ======================
      # CLOUDWATCH: BACKUP AUDIT LOG
      # ======================
      - name: Send backup result to CloudWatch
        if: always()
        run: |
          LOG_STREAM="daily-backup-$(date +%Y-%m-%d)"
          TIMESTAMP=$(date +%s000)

          aws logs create-log-stream \
            --region eu-north-1 \
            --log-group-name safebet-backups \
            --log-stream-name "$LOG_STREAM" 2>/dev/null || true

          JOB_STATUS="${{ job.status }}"

          MESSAGE=$(printf '{"event":"daily-backup","status":"%s","run_id":"%s","actor":"%s","timestamp":"%s"}' \
            "$JOB_STATUS" "${{ github.run_id }}" "${{ github.actor }}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)")

          LOG_EVENTS=$(jq -n --argjson ts "$TIMESTAMP" --arg msg "$MESSAGE" '[{"timestamp":$ts,"message":$msg}]')
          aws logs put-log-events \
            --region eu-north-1 \
            --log-group-name safebet-backups \
            --log-stream-name "$LOG_STREAM" \
            --log-events "$LOG_EVENTS"

          echo "📋 Audit log written to CloudWatch stream: $LOG_STREAM"
