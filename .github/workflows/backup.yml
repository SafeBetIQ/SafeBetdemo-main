name: Daily Backup to S3

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'  # Runs daily at 2AM South Africa time

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Force IPv4
        run: |
          echo "precedence ::ffff:0:0/96  100" | sudo tee -a /etc/gai.conf

      # Install PostgreSQL 17 client
      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release
          echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          wget -qO - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /etc/apt/trusted.gpg.d/postgresql.asc
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      # Verify pg_dump version
      - name: Verify pg_dump version
        run: |
          /usr/lib/postgresql/17/bin/pg_dump --version
          which pg_dump

      # Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      # Set date variables
      - name: Set date variables
        run: |
          echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
          echo "YEAR=$(date +'%Y')" >> $GITHUB_ENV
          echo "MONTH=$(date +'%m')" >> $GITHUB_ENV
          echo "DAY=$(date +'%d')" >> $GITHUB_ENV

      # ======================
      # DEMO BACKUP
      # ======================
      - name: Backup Demo DB
        env:
          SUPABASE_DB_URL_DEMO: ${{ secrets.SUPABASE_DB_URL_DEMO }}
        run: |
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL_DEMO" > demo-backup.sql
          gzip demo-backup.sql

      - name: Upload Demo to S3
        run: |
          aws s3 cp demo-backup.sql.gz \
          s3://safebetiq-backups-046276255259-eu-north-1-an/backups/demo/$YEAR/$MONTH/demo-backup-$DATE.sql.gz \
          --region eu-north-1 --sse AES256

      # ======================
      # PRODUCTION BACKUP
      # ======================
      - name: Backup Production DB
        env:
          SUPABASE_DB_URL_PROD: ${{ secrets.SUPABASE_DB_URL_PROD }}
        run: |
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL_PROD" > prod-backup.sql
          gzip prod-backup.sql

      - name: Upload Production to S3
        run: |
          aws s3 cp prod-backup.sql.gz \
          s3://safebetiq-backups-046276255259-eu-north-1-an/backups/production/$YEAR/$MONTH/production-backup-$DATE.sql.gz \
          --region eu-north-1 --sse AES256

      # ======================
      # MONTHLY BACKUP (DAY 1 ONLY)
      # ======================
      - name: Upload Monthly Backup
        if: env.DAY == '01'
        run: |
          aws s3 cp prod-backup.sql.gz \
          s3://safebetiq-backups-046276255259-eu-north-1-an/backups/monthly/$YEAR/$MONTH/monthly-backup-$DATE.sql.gz \
          --region eu-north-1 --sse AES256

      # ======================
      # RESTORE TEST
      # ======================
      - name: Download latest backup
        run: |
          aws s3 cp \
          s3://safebetiq-backups-046276255259-eu-north-1-an/backups/production/$YEAR/$MONTH/production-backup-$DATE.sql.gz \
          restore-test.sql.gz

      - name: Unzip backup
        run: |
          gunzip restore-test.sql.gz

      - name: Validate backup
        run: |
          if [ ! -s restore-test.sql ]; then
            echo "❌ Backup file is empty!"
            exit 1
          fi
          head -n 20 restore-test.sql

      # ======================
      # CLEANUP
      # ======================
      - name: Cleanup files
        run: |
          rm -f demo-backup.sql.gz prod-backup.sql.gz restore-test.sql

      # ======================
      # EMAIL ALERTS (WORKING VERSION)
      # ======================
      - name: Send backup status email
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: mail.safebetiq.com
          server_port: 587
          secure: false
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "SafeBet IQ Backup Status: ${{ job.status }}"
          to: alerts@safebetiq.com
          from: alerts@safebetiq.com
          body: |
            Backup job status: ${{ job.status }}

            Repo: ${{ github.repository }}
            Workflow: ${{ github.workflow }}
            Run: ${{ github.run_number }}

            View logs:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
